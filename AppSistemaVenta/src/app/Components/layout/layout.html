<mat-toolbar style="background-color: #003cbe; color: white;">
    <mat-toolbar-row>
        <h1 class="title">Sistema de Ventas</h1>

        <button mat-icon-button class="btn-menu" (click)="sidenav.toggle();">
            <mat-icon>menu</mat-icon>
        </button>

        <span style="flex: 1 1 auto;"></span>
        <label style="font-size: 14px; margin-right: 20px;">
            {{correoUsuario}} | {{rolUsuario}}
        </label>
        <button mat-icon-button class="btn-menu" (click)="cerrarSesion()">
            <mat-icon>logout</mat-icon>
        </button>


    </mat-toolbar-row>
</mat-toolbar>

<mat-sidenav-container>
    <mat-sidenav #sidenav opened="true" mode="side" style="width: 240px">
        <mat-nav-list>

            <a mat-list-item *ngFor="let menu of listaMenus" [routerLink]="menu.url">
                <mat-icon matListItemIcon>{{menu.icono}}</mat-icon>
                <span matListItemTitle>{{menu.nombre}}</span>
            </a>




        </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
        <div style="height: 90vh;">
            <router-outlet></router-outlet>
        </div>
    </mat-sidenav-content>
</mat-sidenav-container>
